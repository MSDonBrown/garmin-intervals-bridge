name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # the guides promise Windows and the Mac too: the whole suite there as well (thanks @FrancescoCastaldi)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.12 is the oldest supported; the newest are what python.org offers people today
        python-version: ['3.12', '3.13', '3.14', '3.15']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.15'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
        if: runner.os == 'Linux'
      - run: pytest -q
      - run: pip-audit --progress-spinner off
        if: runner.os == 'Linux'
  # The guides promise Windows and the Mac: install the package there and run what a first
  # command does (settings, time zone, data folder, locks), without network or a key.
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: garmin-intervals-bridge --version
      - run: python -m garmin_intervals_bridge --version          # what the Windows guide uses
      - run: garmin-intervals-bridge status
        env:
          INTERVALS_API_KEY: not-a-real-key
          BRIDGE_DATA_DIR: ${{ runner.temp }}/bridge-data

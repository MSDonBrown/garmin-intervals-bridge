name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # the guides promise Windows and the Mac too: the whole suite there as well (thanks @FrancescoCastaldi)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
        if: runner.os == 'Linux'
      - run: pytest -q
      - run: pip-audit --progress-spinner off
        if: runner.os == 'Linux'
  # The guides promise Windows and the Mac: install the package there and run what a first
  # command does (settings, time zone, data folder, locks), without network or a key.
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: garmin-intervals-bridge --version
      - run: python -m garmin_intervals_bridge --version          # what the Windows guide uses
      - run: garmin-intervals-bridge status
        env:
          INTERVALS_API_KEY: not-a-real-key
          BRIDGE_DATA_DIR: ${{ runner.temp }}/bridge-data
      # What `setup` does at its end, for real on this throwaway machine: register the logon
      # task (Windows) / LaunchAgent (macOS), ask for it, remove it again.
      - name: autostart
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/GarminBridge"
          printf 'INTERVALS_API_KEY=not-a-real-key\nBRIDGE_LOG_FILE=bridge.log\n' > "$RUNNER_TEMP/GarminBridge/.env"
          bridge="python -m garmin_intervals_bridge --env-file $RUNNER_TEMP/GarminBridge/.env"
          $bridge autostart --dry-run
          $bridge autostart
          $bridge autostart --status
          # the background bridge itself starts (no window, no terminal) and writes its log file
          for i in $(seq 1 45); do grep -q "running (enrich mode)" "$RUNNER_TEMP/GarminBridge/bridge.log" 2>/dev/null && break; sleep 2; done
          cat "$RUNNER_TEMP/GarminBridge/bridge.log"
          grep -q "running (enrich mode)" "$RUNNER_TEMP/GarminBridge/bridge.log"
          $bridge autostart --remove
          ! $bridge autostart --status
